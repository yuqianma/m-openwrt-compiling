name: Build Official OpenWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device to build
        required: true
        type: choice
        options:
          - n60pro
          - tr3000
      openwrt_ref:
        description: OpenWrt tag or branch
        required: true
        default: v25.12.5
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      OPENWRT_REPO: https://github.com/openwrt/openwrt.git
      OPENWRT_REF: ${{ inputs.openwrt_ref }}
      CONFIG_FILE: configs/${{ inputs.device }}.config

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl ca-certificates

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 --branch "$OPENWRT_REF" "$OPENWRT_REPO" openwrt
          git -C openwrt rev-parse HEAD | tee openwrt-commit.txt

      - name: Add custom feeds
        run: |
          chmod +x scripts/feeds.sh scripts/customize.sh
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/feeds.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          "$GITHUB_WORKSPACE/scripts/customize.sh"

      - name: Load configuration
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig
          ./scripts/diffconfig.sh | tee "$GITHUB_WORKSPACE/resolved-diffconfig.txt"

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -print -delete

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Record build metadata
        if: always()
        run: |
          {
            echo "device=${{ inputs.device }}"
            echo "openwrt_ref=$OPENWRT_REF"
            echo "openwrt_commit=$(cat openwrt-commit.txt 2>/dev/null || true)"
            echo "passwall_packages_commit=$(git -C openwrt/feeds/passwall_packages rev-parse HEAD 2>/dev/null || true)"
            echo "passwall2_commit=$(git -C openwrt/feeds/passwall2 rev-parse HEAD 2>/dev/null || true)"
          } | tee build-metadata.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ inputs.device }}-${{ inputs.openwrt_ref }}
          path: |
            openwrt/bin/targets/*/*/*
            !openwrt/bin/targets/*/*/packages/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata-${{ inputs.device }}-${{ inputs.openwrt_ref }}
          path: |
            build-metadata.txt
            resolved-diffconfig.txt
          if-no-files-found: ignore
          retention-days: 14
